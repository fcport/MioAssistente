name: Crea app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila l'app
        run: gradle assembleDebug --no-daemon

      - name: Rinomina
        run: cp app/build/outputs/apk/debug/app-debug.apk MioAssistente.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MioAssistente-app
          path: MioAssistente.apk
