name: Crea app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila l'app
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: |What went wrong" -A4 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Controllo librerie native (pagine 16 KB)
        run: |
          mkdir so && cd so && unzip -q ../app/build/outputs/apk/debug/app-debug.apk 'lib/*' || true
          for f in $(find . -name '*.so'); do
            a=$(readelf -lW "$f" | awk '/LOAD/{print $NF; exit}')
            echo "::notice::$f align=$a"
          done

      - name: Rinomina
        run: cp app/build/outputs/apk/debug/app-debug.apk MioAssistente.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MioAssistente-app
          path: MioAssistente.apk

      - name: Pubblica per il download dal telefono
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Mio Assistente (ultima versione)
          body: Apri questa pagina dal telefono e tocca MioAssistente.apk per installare.
          files: MioAssistente.apk
          make_latest: true
